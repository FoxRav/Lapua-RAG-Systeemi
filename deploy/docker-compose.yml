version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lapua-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO

  # Optional: heavier sparse index with Finnish tokenization out of the box.
  # Comment out if you stick with SQLite FTS5.
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: lapua-meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    environment:
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true

  # Optional: vLLM server for heavy extraction / answer workloads.
  # Uncomment when deploying on Linux / WSL2 with NVIDIA GPU.
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: >
  #     --model Qwen/Qwen2.5-1.5B-Instruct
  #     --enable-lora
  #     --lora-modules lapua-llm-v2=CCG-FAKTUM/lapua-llm-v2
  #     --max-model-len 8192
  #   ports:
  #     - "8000:8000"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface

volumes:
  qdrant_data:
  meili_data:
